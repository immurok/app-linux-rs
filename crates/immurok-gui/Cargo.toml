[package]
name = "immurok-gui"
version = "0.9.0"
edition = "2021"
license = "Apache-2.0"
description = "immurok graphical settings app and quick-fill panel"

[[bin]]
name = "immurok-gui"
path = "src/main.rs"

[dependencies]
immurok-client = { path = "../immurok-client" }
immurok-common = { path = "../immurok-common" }
gtk4 = "0.9"
libadwaita = { version = "0.7", features = ["v1_1"] }
glib = "0.20"
gio = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
glib-build-tools = "0.20"
