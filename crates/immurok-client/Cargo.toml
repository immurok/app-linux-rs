[package]
name = "immurok-client"
version = "0.9.0"
edition = "2021"
license = "Apache-2.0"
description = "Synchronous client for the immurok daemon socket, shared by the TUI and the GUI"

[dependencies]
immurok-common = { path = "../immurok-common" }
libc = "0.2"
serde_json = "1"
ureq = "2"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
p256 = { version = "0.13", features = ["ecdh"] }

[dev-dependencies]
tempfile = "3"
